name: Publish release 1.0.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build browser companion
        run: |
          zip -j X-Bookmarks-Chrome-Extension.zip \
            browser-companion/content.js \
            browser-companion/manifest.json \
            browser-companion/popup.css \
            browser-companion/popup.html \
            browser-companion/popup.js

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 1.0.0 >/dev/null 2>&1 && exit 0
          gh release create 1.0.0 \
            main.js \
            manifest.json \
            styles.css \
            X-Bookmarks-Chrome-Extension.zip \
            --target "$GITHUB_SHA" \
            --title "X Bookmarks Graph 1.0.0" \
            --notes "First public release. Import X bookmarks locally, create linked Obsidian notes, and explore them in an interactive graph. Follow the five simple steps in the README to install."
